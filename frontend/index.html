<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="2anNews — Rumah berita sepak bola" />
    <meta name="theme-color" content="#f7f7f3" />
    <title>2anNews | Rumah Berita Sepak Bola</title>
    <script>
      (() => {
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('2annews-theme'); } catch { /* Use system preference when storage is unavailable. */ }
        const dark = savedTheme === 'dark' || (!savedTheme && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', Boolean(dark));
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#101916' : '#f7f7f3');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
